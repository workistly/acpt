name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # This name is what appears as the status check on a PR, and what you select as the required
    # check in branch protection. Keep it stable.
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # The build imports src/utils/firebase.ts, which calls getStorage() at module load and throws
      # without a bucket. These are placeholders so the build can run; CI never talks to Firebase.
      # Keep this list in sync with .env.example — a missing var shows up here as a build failure.
      NEXT_PUBLIC_URL: http://localhost:3060
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-placeholder.appspot.com
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '0'
      NEXT_PUBLIC_FIREBASE_APP_ID: '1:0:web:0'
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_placeholder
      NEXTAUTH_URL: http://localhost:3060
      NEXTAUTH_SECRET: ci-placeholder-not-a-real-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile

      # Must run before typecheck/test/build: src/locales/**/*.ts is git-ignored and generated.
      # Without this every page returns HTTP 500 at runtime — see docs/ARCHITECTURE.md.
      - name: Compile i18n catalogs
        run: yarn compile

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Format
        run: yarn format:check

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build
